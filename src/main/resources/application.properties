
# ==========================================
# StreamSphere Application Configuration
# ==========================================

spring.application.name=StreamSphere

# ==========================================
# Database Configuration (MySQL)
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ==========================================
# Mail & Brevo API Configuration
# ==========================================

spring.mail.username=${MAIL_USERNAME}

brevo.sender.email=${BREVO_SENDER_MAIL}
brevo.sender.name=${BREVO_SENDER_NAME:StreamSphere}
brevo.api.key=${BREVO_API_KEY}

# ==========================================
# Render Server Configuration
# ==========================================

server.port=${PORT:10000}

